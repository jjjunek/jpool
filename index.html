<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>더제이풀</title>
<style>
:root{--card:rgba(255,255,255,.93);--fg:#143a5c;--acc:#1f7bff;--chip:#e8f4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(20,32,52,.93);--fg:#eaf4ff;--chip:#24385a;color-scheme:dark}}
:root[data-theme="dark"]{--card:rgba(20,32,52,.93);--fg:#eaf4ff;--chip:#24385a;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:#a9c8c8;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--fg);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.panel{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,420px);background:var(--card);border-radius:24px;padding:14px 16px;text-align:center;max-height:68vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,60,120,.25)}
h1{margin:0 0 2px;font-size:22px}
p{margin:0 0 10px;font-size:14px;opacity:.8}
.row{display:flex;align-items:center;gap:8px;margin-bottom:9px;text-align:left}
.row>span{width:50px;flex:none;font-size:13px;font-weight:700}
.sws{display:flex;gap:7px;flex-wrap:wrap}
.sws button{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.3);padding:0}
.sws button.on{border-color:var(--fg);transform:scale(1.18)}
label{display:block;margin-bottom:12px;font-size:15px}
button{font:inherit;color:inherit}
#go{width:100%;border:0;border-radius:16px;padding:13px;font-size:18px;font-weight:700;background:var(--acc);color:#fff;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--dockH,96px) + 160px);z-index:6;transform:translateX(-50%);background:var(--card);border-radius:14px;padding:8px 14px;font-size:13px;max-width:80vw;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
#gg{display:flex;gap:6px;flex-wrap:wrap}
#gg button{border:2px solid transparent;border-radius:999px;padding:7px 12px;background:var(--chip);cursor:pointer;font-weight:600;font-size:14px}
#gg button.on{border-color:var(--acc)}
#nick{flex:1;min-width:0;border:2px solid var(--chip);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;background:var(--card);color:var(--fg);user-select:text;-webkit-user-select:text}
#nick.bad{border-color:#e5384b}
#stick{display:none;position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + var(--dockH,96px) + 26px);width:120px;height:120px;border-radius:50%;background:var(--card);touch-action:none}
#stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:var(--acc);opacity:.85}
@media (pointer:coarse){#stick{display:block}}

/* ---------- 게임 화면 UI: 왼쪽 위 정보카드 · 오른쪽 위 상태카드 · 아래 액션바 ---------- */
.glass{background:rgba(10,36,60,.6);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  border:1px solid rgba(190,228,255,.18);box-shadow:0 10px 30px rgba(0,20,40,.25);color:#f1f8fd}
.hcard{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));border-radius:22px;padding:13px 15px;box-sizing:border-box;text-align:left;z-index:5}
#info{left:max(10px,env(safe-area-inset-left,0px));width:calc(54% - 15px);max-width:300px}
#status{right:max(10px,env(safe-area-inset-right,0px));width:calc(46% - 15px);max-width:250px}
.eyebrow{margin:0;font-weight:800;font-size:11px;letter-spacing:.24em;color:#ffd36b}
.ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;margin:5px 0 7px}
.ttl b{font-size:24px;font-weight:800;line-height:1.15}
.ttl span{font-size:12px;opacity:.7}
#wBtn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:0;background:none;padding:0;font-size:13.5px;font-weight:600;text-align:left;cursor:pointer;line-height:1.4}
#wBtn b{font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:#ffd36b;box-shadow:0 0 0 3px rgba(255,211,107,.2);flex:none}
.dot.wet{background:#63d6ff;box-shadow:0 0 0 3px rgba(99,214,255,.22)}
#wList{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15);font-size:13px;max-height:140px;overflow-y:auto}
#wList div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.rb{display:flex;justify-content:space-between;align-items:center;gap:6px}
.lbl{font-size:12px;font-weight:600;opacity:.72}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.tag.go{background:rgba(99,214,255,.2);color:#63d6ff}
.tag.warn{background:rgba(229,56,75,.25);color:#ff8a95}
#stName{font-size:26px;font-weight:800;line-height:1.15;margin:4px 0 9px}
#gPct{font-size:15px;font-variant-numeric:tabular-nums}
#gauge{position:relative;height:9px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:5px}
#gFill{display:block;height:100%;width:0;border-radius:99px;background:#3fd66b}
#gauge b{position:absolute;top:0;bottom:0;width:2px;background:rgba(10,36,60,.55)}
#gauge b:nth-of-type(1){left:25%}
#gauge b:nth-of-type(2){left:50%}
#gauge b:nth-of-type(3){left:75%}
#gTxt{display:block;margin-top:6px;font-size:11.5px;opacity:.75}
#status.hard #gFill{animation:blink .45s infinite alternate}
#status.hard #gTxt{color:#ff8a95;font-weight:700;opacity:1}
@keyframes blink{from{opacity:1}to{opacity:.45}}
#dock{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;border-radius:26px;padding:10px 8px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;box-sizing:border-box}
.acts{display:flex;justify-content:space-evenly;align-items:center;width:100%;flex-wrap:wrap;row-gap:2px}
.acts button{border:0;background:none;font-size:clamp(14px,4vw,16px);font-weight:600;padding:10px 8px;border-radius:12px;cursor:pointer;white-space:nowrap;color:#f1f8fd}
.acts button:active{background:rgba(255,255,255,.12)}
.acts button:focus-visible,#strokes button:focus-visible,#wBtn:focus-visible{outline:2px solid #63d6ff;outline-offset:2px}
.sep{width:1px;height:24px;background:rgba(255,255,255,.25)}
#strokes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#strokes button{border:1.5px solid rgba(255,211,107,.45);border-radius:99px;padding:8px 13px;background:rgba(255,211,107,.08);color:#f1f8fd;font-weight:700;font-size:14px;cursor:pointer}
#strokes button.on{background:rgba(255,211,107,.28);border-color:#ffd36b}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="select" class="panel">
  <h1>🏊 더제이풀</h1>
  <div class="row"><span>닉네임</span><input id="nick" maxlength="10" placeholder="입장할 때마다 정해요 (10자 이내)" autocomplete="off"></div>
  <div class="row"><span>수영복</span><div id="sw" class="sws"></div></div>
  <div class="row"><span>수모</span><div id="capc" class="sws"></div></div>
  <div class="row"><span>수경</span><div id="gg"></div></div>
  <div class="row"><span>렌즈</span><div id="lensc" class="sws"></div></div>
  <div class="row"><span>프레임</span><div id="framec" class="sws"></div></div>
  <label><input type="checkbox" id="cap" checked> 수영모 쓰기</label>
  <button id="go">입장하기 🌊</button>
</div>
<div id="hud" hidden>
  <section id="info" class="hcard glass" aria-label="수영장 정보">
    <p class="eyebrow">THE J POOL</p>
    <div class="ttl"><b>더제이풀</b><span>실내 수영장</span></div>
    <button id="wBtn" aria-label="접속자 목록 보기"><i class="dot" id="dot"></i><span id="where">풀사이드</span><span>·</span><span>접속자 <b id="online">1</b>명</span></button>
    <div id="wList" hidden></div>
  </section>
  <section id="status" class="hcard glass" aria-label="현재 영법과 호흡">
    <div class="rb"><span class="lbl">현재 영법</span><span id="stTag" class="tag">쉬는 중</span></div>
    <div id="stName">물 밖</div>
    <div class="rb"><span class="lbl">호흡</span><b id="gPct">0%</b></div>
    <div id="gauge"><i id="gFill"></i><b></b><b></b><b></b></div>
    <small id="gTxt">편도 0회</small>
  </section>
  <div id="toast"></div>
  <div id="stick"><i></i></div>
  <nav id="dock" class="glass" aria-label="동작">
    <div class="acts">
      <button id="sit">앉기</button>
      <button id="gt">수경 벗기</button>
      <button id="rv">시점 초기화</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="back">탈의실</button>
    </div>
    <div id="strokes" hidden></div>
  </nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const L=(a,b,k)=>a+(b-a)*k;
const turn=(c,t,k)=>c+Math.atan2(Math.sin(t-c),Math.cos(t-c))*k;
// 수영장: 레인 5개. 이전보다 길이 1.3배(32.5), 폭 1.1배(13.75)
const PX=6.875,PZ=16.25;
const SIDE=5.425;                               // 물 밖 좌우 폭 (이전 7.75의 70%)
const DX=PX+SIDE,DZ=PZ+7.5,DECK=0.4,TOP=7.4;
const LW=PX*2/5;                                // 레인 폭 2.75
const ROPES=[-1.5*LW,-.5*LW,.5*LW,1.5*LW];      // 레인 사이 줄 4개
const CZ=PZ/3;                                  // 3번 레인 기둥: 수영장 길이를 3등분하는 위치
const COLS=[[0,-CZ],[0,CZ]];
const SD=.9;                                    // 계단 한 단 깊이 (왼쪽 1·2번 레인)
const TW=PX/6;                                  // 물 밖 타일 한 장의 폭 (수영장 가장자리에서 딱 맞게 시작)
const SPAWN=PZ+4.5;                             // 입장 위치

const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();
S.background=new THREE.Color(0xa9c8c8);
S.fog=new THREE.Fog(0xa9c8c8,55,130);
const cam=new THREE.PerspectiveCamera(50,1,.1,250);
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();

/* ---------- 텍스처 ---------- */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function tiles(g,w,h,s,base,gr){
  for(let y=0;y<h;y+=s)for(let x=0;x<w;x+=s){
    g.fillStyle=base;g.fillRect(x,y,s,s);
    g.fillStyle='rgba(255,255,255,'+(Math.random()*.1)+')';g.fillRect(x,y,s,s);
    g.fillStyle=gr;g.fillRect(x,y,s,1.5);g.fillRect(x,y,1.5,s);
  }
}
function tex(c,rx,ry){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t}

// 수영장 바닥: 청록빛 정사각형 타일 + 레인(5개)마다 짙은 파랑 T자 라인
const FW=Math.round(PX*80),FH=Math.round(PZ*80);
const fc=cv(FW,FH),fg=fc.getContext('2d');
tiles(fg,FW,FH,20,'#35a8b5','#8fd6df');
fg.fillStyle='#1a3a8f';
for(let i=0;i<5;i++){const x=FW/5*(i+.5);fg.fillRect(x-5,52,10,FH-104);fg.fillRect(x-32,52,64,12);fg.fillRect(x-32,FH-64,64,12)}
const floorT=tex(fc,1,1);
// 수영장 안쪽 벽 타일
const wc=cv(64,64);tiles(wc.getContext('2d'),64,64,64,'#3aa6b3','#8fd6df');
const wl=tex(wc,PZ*4,3.6),ws=tex(wc,PX*4,3.6);
const bm=t=>new THREE.MeshLambertMaterial({map:t,side:THREE.BackSide});
const pool=new THREE.Mesh(new THREE.BoxGeometry(PX*2,1.8,PZ*2),[bm(wl),bm(wl),bm(wl),bm(floorT),bm(ws),bm(ws)]);
pool.position.y=-0.5;S.add(pool);

// 물 밖 바닥(데크): 큼직한 따뜻한 회색 석재 타일 (수영장 가장자리에서 타일 경계가 시작됨)
const dc=cv(256,256),dg=dc.getContext('2d');
for(let r=0;r<4;r++)for(let c=0;c<2;c++){const v=Math.floor(Math.random()*18)-9;dg.fillStyle='rgb('+(157+v)+','+(139+v)+','+(131+v)+')';dg.fillRect(c*128,r*64,128,64)}
dg.fillStyle='#7d6e67';for(let r=0;r<4;r++)dg.fillRect(0,r*64,256,2);for(let c=0;c<2;c++)dg.fillRect(c*128,0,2,256);
const sh=new THREE.Shape();sh.moveTo(-DX,-DZ);sh.lineTo(DX,-DZ);sh.lineTo(DX,DZ);sh.lineTo(-DX,DZ);sh.closePath();
const hole=new THREE.Path();hole.moveTo(-PX,-PZ);hole.lineTo(-PX,PZ);hole.lineTo(PX,PZ);hole.lineTo(PX,-PZ);hole.closePath();sh.holes.push(hole);
const deck=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshLambertMaterial({map:tex(dc,1/(2*TW),1/(2*TW))}));
deck.rotation.x=-Math.PI/2;deck.position.y=DECK;S.add(deck);
const skirt=new THREE.Mesh(new THREE.PlaneGeometry(DX*2,1.6),new THREE.MeshLambertMaterial({color:0x7d6e67}));
skirt.position.set(0,-.4,DZ);S.add(skirt);
// 배수구: 수영장 옆 첫 번째 타일 바로 옆
const grateM=new THREE.MeshLambertMaterial({color:0x2d2f31});
[-1,1].forEach(s=>{const g=new THREE.Mesh(new THREE.BoxGeometry(.3,.02,PZ*2),grateM);g.position.set(s*(PX+TW+.15),DECK+.011,0);S.add(g)});

/* ---------- 벽: 회색 벽 + 밝은 회색 벽기둥 + 오른쪽 벽 로고 ---------- */
const wallM=new THREE.MeshLambertMaterial({color:0x9d8f86,side:THREE.DoubleSide});
[[0,-DZ,0,DX*2],[-DX,0,Math.PI/2,DZ*2],[DX,0,-Math.PI/2,DZ*2]].forEach(([x,z,ry,w])=>{
  const a=new THREE.Mesh(new THREE.PlaneGeometry(w,7),wallM);a.position.set(x,3.9,z);a.rotation.y=ry;S.add(a);
});
const pilM=new THREE.MeshLambertMaterial({color:0xb0a59d});
const pil=(x,z,w,d)=>{const p=new THREE.Mesh(new THREE.BoxGeometry(w,7,d),pilM);p.position.set(x,3.9,z);S.add(p)};
[-14.25,-6.5,6.5,14.25].forEach(z=>{pil(-DX+.35,z,.7,1.4);pil(DX-.35,z,.7,1.4)});
[-8.5,-3.5,3.5,8.5].forEach(x=>pil(x,-DZ+.35,1.4,.7));

// 로고: The JPool (사진 속 로고 모양·색을 본떠 캔버스로 그림)
const lg=cv(1024,512),g=lg.getContext('2d');
g.scale(1.412,1.412);g.lineCap='round';g.lineJoin='round';
const grad=(y0,y1,a,b)=>{const q=g.createLinearGradient(0,y0,0,y1);q.addColorStop(0,a);q.addColorStop(1,b);return q};
g.font='italic 900 98px Arial,"Helvetica Neue",sans-serif';g.textBaseline='alphabetic';
g.lineWidth=16;g.strokeStyle='#2a74d6';g.strokeText('The',62,142);
g.fillStyle=grad(60,150,'#ffffff','#c9d3dc');g.fillText('The',62,142);
g.lineWidth=34;g.strokeStyle=grad(110,300,'#3fdc6b','#1f6fe0');                    // J
g.beginPath();g.moveTo(398,128);g.lineTo(398,236);g.quadraticCurveTo(398,290,350,290);g.quadraticCurveTo(312,290,306,262);g.stroke();
g.lineWidth=6;g.strokeStyle='#17356f';                                              // J 아래 파도
for(let r=0;r<2;r++){g.beginPath();for(let x=322;x<=408;x+=4){const y=300+r*11+Math.sin((x-322)/7)*3;x===322?g.moveTo(x,y):g.lineTo(x,y)}g.stroke()}
g.lineWidth=30;g.strokeStyle=grad(110,260,'#3fdc6b','#18b6a0');                    // P
g.beginPath();g.moveTo(452,128);g.lineTo(452,250);g.stroke();
g.beginPath();g.moveTo(452,128);g.lineTo(478,128);g.arc(478,160,32,-Math.PI/2,Math.PI/2);g.lineTo(452,192);g.stroke();
g.lineWidth=24;g.strokeStyle='#1f86df';g.beginPath();g.arc(546,232,26,0,Math.PI*2);g.stroke();   // o
g.strokeStyle='#1d5fd0';g.beginPath();g.arc(602,224,26,0,Math.PI*2);g.stroke();                  // o
g.fillStyle='#10306b';g.beginPath();g.ellipse(612,198,12,6,-.5,0,Math.PI*2);g.fill();            // 돌고래 포인트
g.fillStyle='#fff';g.beginPath();g.arc(616,196,2,0,Math.PI*2);g.fill();
g.lineWidth=22;g.strokeStyle=grad(110,260,'#3fdc6b','#1f6fe0');                    // l
g.beginPath();g.moveTo(656,128);g.lineTo(656,252);g.stroke();
g.font='bold 15px Arial,sans-serif';g.fillStyle='#ffffff';g.textAlign='left';g.fillText('The Highest-class Swimming Pool',430,296);
const sign=new THREE.Mesh(new THREE.PlaneGeometry(7,3.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(lg),transparent:true}));
sign.position.set(DX-.06,3.7,0);sign.rotation.y=-Math.PI/2;S.add(sign);   // 오른쪽 벽 중간

/* ---------- 3번 레인 회색 기둥 2개 (수영장 길이를 3등분하는 위치) ---------- */
const colM=new THREE.MeshLambertMaterial({color:0x56535a}),collarM=new THREE.MeshLambertMaterial({color:0xcfd2d0});
COLS.forEach(([x,z])=>{
  const c=new THREE.Mesh(new THREE.BoxGeometry(1.2,TOP+1.4,1.2),colM);c.position.set(x,(TOP-1.4)/2,z);S.add(c);
  const k=new THREE.Mesh(new THREE.BoxGeometry(1.9,.35,1.9),collarM);k.position.set(x,TOP-.18,z);S.add(k);
});

/* ---------- 천장: 청록빛 회색 + 파란 LED 띠 ---------- */
const cc=cv(256,256),cg=cc.getContext('2d');
cg.fillStyle='#86b5b6';cg.fillRect(0,0,256,256);
cg.fillStyle='rgba(0,0,0,.04)';for(let i=0;i<300;i++)cg.fillRect(Math.random()*256,Math.random()*256,2,2);
cg.fillStyle='#79a7a8';cg.fillRect(0,0,256,2);cg.fillRect(0,0,2,256);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(DX*2,DZ*2),new THREE.MeshLambertMaterial({map:tex(cc,DX*2/2.4,DZ*2/2.4)}));
ceil.rotation.x=Math.PI/2;ceil.position.y=TOP;S.add(ceil);   // 아래쪽만 보이는 면 (위에서 내려다보면 투명)
const ledM=new THREE.MeshBasicMaterial({color:0x3d7fe6});
[-8.5,8.5].forEach(x=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.3,.05,DZ*2-1),ledM);l.position.set(x,TOP-.03,0);S.add(l)});

/* ---------- 입수 계단: 왼쪽 1·2번 레인 + 스테인리스 손잡이 ---------- */
const stM=new THREE.MeshLambertMaterial({color:0xa2c4bd}),steel=new THREE.MeshLambertMaterial({color:0xcfd6dc});
const stW=ROPES[1]-(-PX),stX=(-PX+ROPES[1])/2;     // 1·2번 레인 폭과 중심
for(let k=0;k<3;k++){
  const top=-.1-.35*k,zc=PZ-SD*k-SD/2;

  const sm=new THREE.MeshLambertMaterial({color:0x101216});                                   // 머리끈

    const lens=add(cup,new THREE.SphereGeometry(1,24,12),lm,0,0,.055);lens.scale.set(o.w*.9,o.h*.88,.05);                  // 볼록한 렌즈
    const rim=add(cup,new THREE.TorusGeometry(1,.07,8,28),fm,0,0,.05);rim.scale.set(o.w*.97,o.h*.97,.8);                   // 렌즈 테두리
    add(cup,new THREE.BoxGeometry(.06,.05,.04),fm,s*(o.w+.025),0,0);                                                       // 머리끈 연결 고리
    if(o.ridge){const rg=add(cup,new THREE.TorusGeometry(1,.05,6,20,Math.PI),fm,0,0,.06);rg.scale.set(o.w*1.02,o.h*1.02,1)}   // 윗부분 눈썹 라인
  });

  band(.575,-.73,.73,-.27,.27,lm);                                    // 하나로 이어진 큰 렌즈

// 캐릭터 한 명의 자세를 상태(s)에 맞춰 부드럽게 움직임: 나도, 다른 접속자도 같은 함수를 씀
// s = {sit:'rope'|'edge'|'step'|0, sw:물속 수영 여부, stroke, mv:움직임(0~1), winded, breath(0~1), facing}
function animChar(c,s,dt){
  const {pitch,arms,legs}=c,sd=STROKES[s.stroke]||STROKES.free,sit=s.sit,sw=s.sw,stroke=s.stroke,winded=s.winded,mv=s.mv;
  c.wd=L(c.wd,winded?1:0,Math.min(1,dt*4));
  c.flip=turn(c.flip,(sw&&stroke==='back')?Math.PI:0,Math.min(1,dt*10));   // 배영은 하늘을 보고 누워서 헤엄
  c.hero.rotation.y=s.facing+c.flip;
  const s7=Math.sin(t*10);let P,AL,AR,LL,LR,LZ=0,AZ=.12,roll=0,bob=0;
  if(sw&&stroke!=='walk')c.ph+=dt*sd.rate*(mv>.05?1:.35);
  const ph=c.ph,PI=Math.PI;
  if(sit==='rope'){P=0;AL=AR=0;LL=LR=0;LZ=.55}
  else if(sit==='edge'||sit==='step'){P=0;AL=AR=-.25;LL=LR=-.7}
  else if(sw){
    if(stroke==='walk'){                         // 걷기(기본): 바닥에 두 발로 서서 물속을 걸어요. 멈추면 그냥 서 있어요
      const m=mv>.05?1:0,w7=Math.sin(t*7);P=winded?.4:0;AL=winded?-.7:w7*.5*m;AR=winded?-.7:-w7*.5*m;LL=winded?-.4:-AL*.8;LR=winded?-.4:-AR*.8;AZ=.25;
    }else if(stroke==='free'){                        // 자유형: 팔을 번갈아 크게 돌리고 발은 잔잔하게 차요
      P=1.25;AL=ph;AR=ph+PI;LL=Math.sin(ph*3)*.35;LR=-LL;roll=Math.sin(ph)*.3;
    }else if(stroke==='back'){                   // 배영: 누워서 팔을 뒤로 번갈아 돌려요
      P=-1.25;AL=-ph;AR=-ph-PI;LL=Math.sin(ph*3)*.35;LR=-LL;roll=Math.sin(ph)*.25;
    }else if(stroke==='breast'){                 // 평영: 두 팔을 동시에 벌렸다 모으고, 개구리처럼 차요
      const a=.5+.5*Math.sin(ph),kk=.5+.5*Math.sin(ph-1.7);
      P=1.25-.3*a;AL=AR=PI-a;AZ=.15+.6*a;LL=LR=.15+.7*kk;LZ=.12+.5*kk;bob=Math.sin(ph-.6)*.08;
    }else if(stroke==='fly'){                    // 접영: 두 팔을 함께 돌리고 몸을 파도처럼 굽혀요
      P=1.25+Math.sin(ph*2)*.3;AL=AR=ph;AZ=.4;LL=LR=Math.sin(ph*2+.6)*.5;bob=Math.sin(ph*2+1)*.1;
    }else{                                       // 잠영: 물속 깊이 팔을 쭉 펴고 돌핀킥
      P=1.5708+Math.sin(ph*1.6)*.12;AL=AR=PI;AZ=.05;LL=LR=Math.sin(ph*1.6+.4)*.5;
    }
  }
  else if(winded){const m=mv>.05?1:0;P=.45;AL=AR=-.75;LL=-.45+s7*.45*m;LR=-.45-s7*.45*m}   // 숨찰 땐 허리를 숙이고 무릎에 손
  else{P=0;const m=mv>.05?1:0;AL=s7*.7*m;AR=-s7*.7*m;LL=-AL*.8;LR=-AR*.8}
  const k=Math.min(1,dt*12),wd=c.wd,breath=s.breath;
  pitch.rotation.x=L(pitch.rotation.x,P,k);
  pitch.rotation.y=L(pitch.rotation.y,roll,k);
  const hv=Math.sin(t*13)*wd;                                          // 헥헥 숨쉬는 들썩임
  pitch.position.y=L(pitch.position.y,(sit?0.55:sw&&stroke!=='walk'?0.55+Math.sin(t*3)*.04+bob:0.7+(sw&&mv>.05?Math.sin(t*14)*.025:0))+hv*.03,Math.min(1,dt*10));
  const bs=1+hv*.04;pitch.scale.set(bs,bs,bs);
  c.mouth.visible=wd>.1;c.mouth.scale.set(.08,.03+.05*Math.abs(hv),.02);   // 입 벌리기
  c.faceM.color.setHex(mixHex(0xffd6b3,0xff5648,breath));c.blush.color.setHex(mixHex(0xff9aa8,0xe01f3d,breath));   // 호흡이 찰수록 얼굴·볼이 비례해서 빨개짐
  c.cheeks.forEach(q=>q.scale.set(1+breath*.8,1+breath*.8,.4));
  c.sweat.forEach((d,i)=>{d.visible=wd>.5;d.position.y=1.3-((t*1.1+i*.5)%1)*.45});
  c.huff.visible=wd>.3;c.huff.material.opacity=Math.min(1,wd);c.huff.position.y=3.3+Math.abs(Math.sin(t*6))*.2;
  arms[0].rotation.x=turn(arms[0].rotation.x,AL,k);arms[1].rotation.x=turn(arms[1].rotation.x,AR,k);
  arms[0].rotation.z=L(arms[0].rotation.z,-AZ,k);arms[1].rotation.z=L(arms[1].rotation.z,AZ,k);
  legs[0].rotation.x=turn(legs[0].rotation.x,LL,k);legs[1].rotation.x=turn(legs[1].rotation.x,LR,k);
  legs[0].rotation.z=L(legs[0].rotation.z,-LZ,k);legs[1].rotation.z=L(legs[1].rotation.z,LZ,k);
}

const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);

function cleanPeer(p){
  if(!p||p.on!==1)return null;
  const num=(v,a,b)=>typeof v==='number'&&isFinite(v)?clamp(v,a,b):0;
  return {n:cleanName(p.n)||'손님',x:num(p.x,-DX,DX),y:num(p.y,-1.5,1),z:num(p.z,-DZ,DZ),f:num(p.f,-7,7),

    sc:HEX.test(p.sc)?p.sc:'#ff6b81',cc:HEX.test(p.cc)?p.cc:'#ff6b81',co:p.co?1:0,gt:own(GD,p.gt)?p.gt:'',gl:HEX.test(p.gl)?p.gl:'#79b8ff',gf:HEX.test(p.gf)?p.gf:'#14171c'};
}

function syncPeers(list){
  const seen=new Set();
  list.forEach(pe=>{
    if(pe.sameTab||pe.kind!=='viewer')return;
    const p=cleanPeer(pe.presence);if(!p)return;
    seen.add(pe.peer);

    if(!r){const c=buildChar();c.face=p.f;c.hero.position.set(p.x,p.y,p.z);S.add(c.hero);r={c,p,key:''};remote.set(pe.peer,r)}
    r.p=p;
    const key=[p.sc,p.cc,p.co,p.gt,p.gl,p.gf].join();
    if(key!==r.key){r.key=key;r.c.suit.color.set(p.sc);r.c.capM.color.set(p.cc);r.c.cap.visible=!!p.co;applyGog(r.c,!!p.gt,p.gt,p.gl,p.gf)}
    setTag(r.c,p.n);

  remote.forEach((r,id)=>{if(!seen.has(id)){S.remove(r.c.hero);remote.delete(id)}});
  updateWho();
}

// 직접 올린 웹사이트용: 같은 주소의 /ws 로 접속하는 서버(server.js)와 위치를 주고받음. claude.ai 'room'과 똑같은 모양으로 감싸 둠
function wsRoom(){
  let ws=null,id=null,cb=null,mine=null;
  const send=()=>{if(ws&&ws.readyState===1&&mine)ws.send(JSON.stringify(mine))};
  function connect(){
    ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
    ws.onopen=send;
    ws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.t==='hello')id=m.id;
      else if(m.t==='peers'&&cb&&Array.isArray(m.peers))cb({peers:m.peers.map(q=>({peer:String(q.peer),sameTab:q.peer===id,isMe:q.peer===id,kind:'viewer',presence:q.presence}))});
    };
    ws.onclose=()=>{if(cb)cb({peers:[]});setTimeout(connect,2000)};   // 끊기면 2초 뒤 자동 재접속
  }
  connect();
  return {onPeers(f){cb=f;return()=>{cb=null}},presence(o){mine=o;send();return Promise.resolve()}};
}

function update(dt){

  const mv=Math.hypot(ax,az);
  if(sit&&mv>.25)sit=null;
  if(sit){const k=Math.min(1,dt*10);hp.x=L(hp.x,snap.x,k);hp.z=L(hp.z,snap.z,k);facing=turn(facing,snap.f,k)}
  else if(mv>.05){
    const sp=inPool()?sd.sp*(winded?.55:1):onStairs()?3.6:4.8*(winded?.8:1);
    hp.x=clamp(hp.x+ax*sp*dt,-DX+.6,DX-.6);hp.z=clamp(hp.z+az*sp*dt,-DZ+.6,DZ-.6);

    const dx=hp.x-cx,dz=hp.z-cz,h=1.05;
    if(Math.abs(dx)<h&&Math.abs(dz)<h){if(Math.abs(dx)>Math.abs(dz))hp.x=cx+(Math.sign(dx)||1)*h;else hp.z=cz+(Math.sign(dz)||1)*h}
  });
  if(!sit){                                    // NPC 아저씨는 덩치가 커서 부딪히면 밀려나기
    const dx=hp.x-NPC_X,dz=hp.z-NPC_Z,d=Math.hypot(dx,dz);
    if(d<NPC_R){hp.x=NPC_X+(d?dx/d:0)*NPC_R;hp.z=NPC_Z+(d?dz/d:1)*NPC_R}
  }
  nb.scale.y=1+Math.sin(t*1.7)*.012;nb.rotation.y=Math.sin(t*.5)*.08;   // 숨쉬듯 살짝 움직임
  const sw=!sit&&inPool();
  const inW=mode==='play'&&inPool();                                    // 물에 들어가면 영법 선택 버튼 표시
  if(inW!==wasIn){wasIn=inW;if(inW)lastEnd=hp.z>0?1:-1;$('strokes').hidden=!inW;if(inW){pickStroke('walk');if(!told){told=true;toast('물속에선 처음엔 서 있어요 🧍 헤엄치려면 영법을 골라 보세요 (키보드 숫자 1~6도 돼요)')}}}

  // 호흡 게이지: 실제로 헤엄치는 중에만 편도를 세고, 쉬면 회복 (앉아 있으면 더 빨리)
  const swimming=sw&&mv>.05&&stroke!=='walk';                          // 걷기·서 있기는 호흡이 차지 않고, 오히려 쉬는 것으로 침
  const wading=sw&&mv>.05&&stroke==='walk';
  const dd=Math.min(1,Math.hypot(hp.x-lx,hp.z-lz));lx=hp.x;lz=hp.z;
  const fillPerM=.25/(PZ*2);                                           // 편도(수영장 길이) 한 번에 정확히 25%: 헤엄친 거리에 비례해 일정하게(리니어) 참
  if(inW&&swimming){
    breath=Math.min(1,breath+dd*fillPerM);
    const e=hp.z>PZ-1.5?1:hp.z<-PZ+1.5?-1:0;
    if(e&&e!==lastEnd){lastEnd=e;laps++}                              // 편도 횟수는 표시용으로만 셈
  }
  if(!swimming)breath=Math.max(0,breath-dt*3.2*fillPerM*.5);          // 줄어드는 속도 = 차는 속도의 절반 (2배 느리게)
  if(!winded&&breath>=1){winded=true;if(mode==='play')toast('헥헥… 숨이 차요! 잠시 쉬면 회복돼요 😮‍💨')}
  else if(winded&&breath<=.5)winded=false;
  if(mode==='play'){                                                    // 왼쪽 위 정보카드 + 오른쪽 위 상태카드 갱신
    const lane=Math.min(5,Math.max(1,Math.floor((hp.x+PX)/LW)+1)),stair=onStairs(),wet=inPool()||stair;
    const where=stair?lane+'번 레인 계단':inPool()?lane+'번 레인':sit==='edge'?'수영장 가장자리':'풀사이드';
    const nm=inW?sd.n:'물 밖';
    const tg=winded?'헥헥':swimming?'수영 중':wading?'걷는 중':sit?'앉아서 쉬는 중':'쉬는 중';
    const pc=Math.round(breath*100),key=[nm,tg,pc,laps,winded,where].join('|');
    if(key!==uiKey){
      uiKey=key;$('stName').textContent=nm;$('gFill').style.width=pc+'%';$('gPct').textContent=pc+'%';
      $('stTag').textContent=tg;$('stTag').className='tag'+(winded?' warn':swimming?' go':'');
      $('gFill').style.background=breath>=1?'#e5384b':breath>=.75?'#ff9f43':breath>=.5?'#ffd93d':'#3fd66b';
      $('gTxt').textContent=winded?'헥헥… 숨이 차요! 잠시 쉬어요':'편도 '+laps+'회';
      $('status').classList.toggle('hard',winded);
      $('where').textContent=where;$('dot').classList.toggle('wet',wet);
    }
  }
  const ty=sit==='rope'?-.3:sit==='edge'?-.05:sit==='step'?stairY()-.45:sw?(stroke==='dive'?-1:stroke==='walk'?-1.3:-.5):onStairs()?stairY():DECK;
  hp.y=L(hp.y,ty,Math.min(1,dt*8));

  animChar(H,{sit:sit||0,sw,stroke,mv,winded,breath,facing},dt);          // 내 캐릭터 자세
  H.tag&&(H.tag.visible=mode==='play');
  remote.forEach(r=>{                                                   // 다른 접속자: 받은 위치로 부드럽게 따라가며 같은 자세 함수로 움직임
    const p=r.p,c=r.c,h=c.hero,k=Math.min(1,dt*9);
    h.position.x=L(h.position.x,p.x,k);h.position.y=L(h.position.y,p.y,k);h.position.z=L(h.position.z,p.z,k);c.face=turn(c.face,p.f,k);
    animChar(c,{sit:p.sit,sw:!!p.sw,stroke:p.st,mv:p.mv,winded:!!p.w,breath:p.br,facing:c.face},dt);
  });
  const sl=sit?'일어서기':'앉기';if(sl!==sitLab){sitLab=sl;$('sit').textContent=sl}   // 앉아 있으면 버튼이 일어서기로 바뀜
  netTick(dt,mv);

  for(let i=0;i<wp.count;i++)wp.setZ(i,Math.sin(wp.getX(i)*1.3+t*2)*.03+Math.cos(wp.getY(i)*1.1+t*1.6)*.03);
  wp.needsUpdate=true;

  // 카메라: 캐릭터를 중심으로 돌아보는 궤도 카메라
  const fx=-Math.sin(orb.yaw),fz=-Math.cos(orb.yaw),ahead=mode==='play'?1.5:0;
  lookT.set(hp.x+fx*ahead,hp.y+(mode==='play'?.9:.3),hp.z+fz*ahead);
  const cp=Math.cos(orb.pitch),spch=Math.sin(orb.pitch);
  camT.set(lookT.x-fx*cp*orb.dist,lookT.y+spch*orb.dist,lookT.z-fz*cp*orb.dist);
  camT.x=clamp(camT.x,-DX+.6,DX-.6);camT.z=Math.max(camT.z,-DZ+.6);camT.y=Math.max(camT.y,.5);   // 벽 뒤·물속으로 못 나가게
  const kc=Math.min(1,dt*8);
  cam.position.lerp(camT,kc);look.lerp(lookT,kc);cam.lookAt(look);
}
const dockEl=$('dock');                                                // 아래 액션바 높이에 맞춰 조이스틱·안내문 위치 조정
const setDockH=()=>document.documentElement.style.setProperty('--dockH',(dockEl.offsetHeight||96)+'px');
if(window.ResizeObserver)new ResizeObserver(setDockH).observe(dockEl);addEventListener('resize',setDockH);
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);R.render(S,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
